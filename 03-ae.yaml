# An example of cluster config that uses access entries for cluster access management.

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop # this is cluster name 
  region: us-east-1
  

accessConfig:
  # this means we are using both aws-auth configmap, we are in the process of migrating to access entries 
  # new users follow API way, old users are foallowing CONFIG_MAP way. priority is API 
  # we will gradually move old users to API way
  authenticationMode: API_AND_CONFIG_MAP 
  accessEntries:
    - principalARN: arn:aws:iam::978092319764:user/rajesh
      type: STANDARD # optional Type
      kubernetesGroups: # optional Kubernetes groups
        - devops-trainees # groups can used to give permissions via RBAC
    - principalARN: arn:aws:iam::978092319764:user/somesh
      type: STANDARD # optional Type
      kubernetesGroups: # optional Kubernetes groups
        - devops-trainees # groups can used to give permissions via RBAC
    - principalARN: arn:aws:iam::978092319764:user/pandu
      type: STANDARD # optional Type
      kubernetesGroups: # optional Kubernetes groups
        - devops-tls # groups can used to give permissions via RBAC

